<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #202124;
    }

    .app-header {
      background: #1a73e8;
      color: white;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Tab bar */
    .tab-bar {
      display: flex;
      background: #fff;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      color: #5f6368;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s;
    }
    .tab-btn.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
      font-weight: 600;
    }
    .tab-btn:hover:not(.active) { background: #f1f3f4; }

    /* Tab content */
    .tab-pane { display: none; padding: 14px; }
    .tab-pane.active { display: block; }

    /* Form elements */
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 4px;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    label:first-child { margin-top: 0; }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #1a73e8; }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary { background: #f1f3f4; color: #3c4043; margin-top: 8px; }
    .btn-secondary:hover { background: #e8eaed; }

    /* Log area */
    .log-header {
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 16px;
      margin-bottom: 6px;
    }
    #log {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 12px;
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
      color: #3c4043;
      line-height: 1.7;
    }
    .log-ok   { color: #137333; }
    .log-err  { color: #c5221f; }
    .log-info { color: #1a73e8; }

    .divider { border: none; border-top: 1px solid #e0e0e0; margin: 14px 0 4px; }

    .hint {
      font-size: 11px;
      color: #80868b;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="app-header">Intrepid GAS Tools</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('brand-split', this)">Brand Split</button>
  <button class="tab-btn"        onclick="switchTab('settings', this)">Settings</button>
</div>

<!-- ============================================================ -->
<!-- TAB: Brand Split                                              -->
<!-- ============================================================ -->
<div id="pane-brand-split" class="tab-pane active">

  <label>Spreadsheet URL</label>
  <input type="text" id="url" placeholder="https://docs.google.com/spreadsheets/d/...">
  <p class="hint">Nhập link Google Sheets chứa sheet Summary.</p>

  <button class="btn btn-primary" id="btn-process" onclick="runProcess()">Xử lý</button>

  <div class="log-header">Log</div>
  <div id="log"><span class="log-info">Sẵn sàng.</span></div>
</div>

<!-- ============================================================ -->
<!-- TAB: Settings                                                 -->
<!-- ============================================================ -->
<div id="pane-settings" class="tab-pane">

  <label>Tên sheet Summary</label>
  <input type="text" id="cfg-summarySheetName" placeholder="Summary">

  <div class="row2">
    <div>
      <label>Header row</label>
      <input type="number" id="cfg-headerRow" placeholder="4" min="1">
    </div>
    <div>
      <label>Data start row</label>
      <input type="number" id="cfg-dataStartRow" placeholder="5" min="1">
    </div>
  </div>

  <hr class="divider">

  <div class="row2">
    <div>
      <label>Cột Brand (E=5)</label>
      <input type="number" id="cfg-colBrand" placeholder="5" min="1">
    </div>
    <div>
      <label>Cột Company (C=3)</label>
      <input type="number" id="cfg-colCompany" placeholder="3" min="1">
    </div>
  </div>

  <label>Cột lọc brand thật (brandFilterCol)</label>
  <input type="number" id="cfg-brandFilterCol" placeholder="3" min="0">
  <p class="hint">Dòng nào có cột này TRỐNG sẽ bị bỏ qua (dành cho header-nhóm như "INT", "Retails Model"). Đặt 0 để dùng cột Brand làm filter.</p>

  <div class="row2">
    <div>
      <label>Summary từ cột (AE=31)</label>
      <input type="number" id="cfg-colSummaryStart" placeholder="31" min="1">
    </div>
    <div>
      <label>Summary đến cột (AR=44)</label>
      <input type="number" id="cfg-colSummaryEnd" placeholder="44" min="1">
    </div>
  </div>

  <div class="row2">
    <div>
      <label>Spending từ cột (AS=45)</label>
      <input type="number" id="cfg-colSpendStart" placeholder="45" min="1">
    </div>
    <div>
      <label>Spending đến cột (BL=64)</label>
      <input type="number" id="cfg-colSpendEnd" placeholder="64" min="1">
    </div>
  </div>

  <hr class="divider">

  <div class="row2">
    <div>
      <label>Fee non-TikTok (%)</label>
      <input type="number" id="cfg-feeNonTiktok" placeholder="9" min="0" max="100">
    </div>
    <div>
      <label>Fee TikTok (%)</label>
      <input type="number" id="cfg-feeTiktok" placeholder="7" min="0" max="100">
    </div>
  </div>

  <label>TikTok keywords (phân cách bởi dấu phẩy)</label>
  <input type="text" id="cfg-tiktokKeywords" placeholder="tiktok,tik tok">
  <p class="hint">Dùng để phân biệt cột TikTok trong spending headers.</p>

  <button class="btn btn-primary" onclick="saveConfig()">Lưu Settings</button>
  <button class="btn btn-secondary" onclick="resetConfig()">Reset về mặc định</button>
  <div id="cfg-status" style="margin-top:8px; font-size:12px;"></div>
</div>

<script>
  // ── Tab switching ──────────────────────────────────────────────
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('pane-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ── Log helpers ────────────────────────────────────────────────
  var logEl = document.getElementById('log');

  function log(msg, cls) {
    var span = document.createElement('span');
    span.className = cls || '';
    span.textContent = msg;
    logEl.innerHTML = '';
    logEl.appendChild(span);
  }

  function logAppend(msg, cls) {
    var div = document.createElement('div');
    div.className = cls || '';
    div.textContent = msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ── Brand Split: Xử lý ────────────────────────────────────────
  function runProcess() {
    var url = document.getElementById('url').value.trim();
    if (!url) { log('Vui lòng nhập Spreadsheet URL.', 'log-err'); return; }

    var btn = document.getElementById('btn-process');
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';
    log('Đang xử lý...', 'log-info');

    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = 'Xử lý';
        if (result.ok) {
          logEl.innerHTML = '';
          result.brands.forEach(function(b) {
            logAppend('✅ ' + b, 'log-ok');
          });
          logAppend('Hoàn thành — ' + result.brands.length + ' brand(s).', 'log-ok');
        } else {
          log('❌ ' + result.error, 'log-err');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'Xử lý';
        log('❌ ' + err.message, 'log-err');
      })
      .processSpreadsheet(url);
  }

  // ── Settings: Load ─────────────────────────────────────────────
  function loadConfig() {
    google.script.run
      .withSuccessHandler(function(raw) {
        for (var key in raw) {
          var el = document.getElementById('cfg-' + key);
          if (el) el.value = raw[key];
        }
      })
      .loadSettings();
  }

  // ── Settings: Save ─────────────────────────────────────────────
  function saveConfig() {
    var keys = [
      'summarySheetName','headerRow','dataStartRow',
      'colBrand','colCompany','brandFilterCol',
      'colSummaryStart','colSummaryEnd',
      'colSpendStart','colSpendEnd',
      'feeNonTiktok','feeTiktok','tiktokKeywords'
    ];
    var settings = {};
    keys.forEach(function(k) {
      var el = document.getElementById('cfg-' + k);
      if (el) settings[k] = el.value.trim();
    });

    document.getElementById('cfg-status').textContent = 'Đang lưu...';
    google.script.run
      .withSuccessHandler(function() {
        document.getElementById('cfg-status').textContent = '✅ Đã lưu settings.';
      })
      .withFailureHandler(function(err) {
        document.getElementById('cfg-status').textContent = '❌ ' + err.message;
      })
      .saveSettings(settings);
  }

  // ── Settings: Reset ────────────────────────────────────────────
  function resetConfig() {
    if (!confirm('Reset tất cả settings về mặc định?')) return;
    google.script.run
      .withSuccessHandler(function() {
        document.getElementById('cfg-status').textContent = '✅ Đã reset. Đang tải lại...';
        loadConfig();
      })
      .resetSettings();
  }

  // Load settings khi mở sidebar
  loadConfig();
</script>
</body>
</html>
